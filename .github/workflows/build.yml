name: Validate Android

on:
  push:
    branches: [main, codex/runtime-config-signing, codex/workbuddy-security, codex/workbuddy-card-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --exclude-tags=golden
      - name: Render provider review images
        env:
          QUOTA_REVIEW_FONT: /tmp/quotadash-review.ttf
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o "$QUOTA_REVIEW_FONT"
          flutter test test/antigravity_widget_test.dart test/workbuddy_widget_test.dart --tags=golden --update-goldens
      - name: Upload visual review
        uses: actions/upload-artifact@v7
        with:
          name: QuotaDash-visual-review-${{ github.sha }}
          path: build/visual-review/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Signing secret ${value} is missing."
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          {
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release.keystore"
          } > android/key.properties
      - name: Validate Android debug build
        if: github.ref != 'refs/heads/codex/runtime-config-signing'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build ARM64 release APK
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify stable release certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          certificate="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$certificate"
          fingerprint="$(printf '%s\n' "$certificate" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          test "$fingerprint" = "de58353c5425c2735bb02c18d6c2591fa7b971d36696eefba8aa332b26557783"

      - name: Upload debug APK
        if: github.ref != 'refs/heads/codex/runtime-config-signing'
        uses: actions/upload-artifact@v7
        with:
          name: CLIProxy-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Only trusted non-PR runs may publish a stable-signed release artifact.
      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: QuotaDash-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
